name: Verify example packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rebuild and verify without credentials or paid work
        run: |
          python3 -B scripts/test_distribution.py
          python3 -B scripts/test_setup.py
          python3 -B scripts/test_review_example.py
          python3 -B scripts/test_review_lab.py
          python3 -B scripts/test_tutorial_launcher.py
          python3 -B scripts/test_tutorial_report.py
